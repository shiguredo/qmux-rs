name: Release

on:
  push:
    tags:
      - "*"

jobs:
  # タグを打った時点で公開前の検証をすべて通す。失敗した場合は Release の作成と
  # publish を行わない
  validate:
    name: "Validate"
    # dwnx-sys のビルドに C コンパイラと libclang が必要なため ubuntu-slim は使わない
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # rust-toolchain.toml に固定した MSRV のツールチェーンを導入する
      - run: rustup show

      # dwnx-sys は bindgen で FFI 宣言を生成するため libclang が必要
      - name: Install libclang
        run: |
          sudo apt-get update
          sudo apt-get install -y libclang-dev
          echo "LIBCLANG_PATH=$(dirname "$(find /usr/lib -name 'libclang.so*' | head -n 1)")" >> "$GITHUB_ENV"

      # タグ名と Cargo.toml の version が一致しないまま publish しないための検査。
      # canary タグ (例: 2026.0.0-canary.0) も Cargo.toml の version と完全一致させる
      - name: Check tag and crate version
        run: |
          tag_version="${GITHUB_REF_NAME#v}"
          crate_version=$(cargo metadata --no-deps --format-version 1 | python3 -c \
            'import json, sys; packages = json.load(sys.stdin)["packages"]; print(next(package["version"] for package in packages if package["name"] == "shiguredo_qmux"))')
          if [ "${tag_version}" != "${crate_version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match Cargo.toml version ${crate_version}" >&2
            exit 1
          fi

      - run: cargo fmt --all --check
      - run: cargo test --workspace
      - run: cargo clippy --workspace --all-targets -- -D warnings

      # 壊れた intra-doc リンクを検出するため、rustdoc の警告をエラーとして扱う。
      # dwnx-sys は bindgen が生成する宣言を持つため対象から除外する
      - name: Build documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --exclude dwnx-sys

      # crates.io へ送るファイルの一覧を検査する
      - run: cargo package --list

  github-release:
    name: "Create GitHub Release"
    needs: [validate]
    runs-on: ubuntu-26.04
    outputs:
      version: ${{ steps.get_version.outputs.VERSION }}
    steps:
      - name: Checkout sources
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get the version
        id: get_version
        run: echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> "$GITHUB_OUTPUT"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if ${{ contains(steps.get_version.outputs.VERSION, 'canary') }}; then
            gh release create ${{ steps.get_version.outputs.VERSION }} \
              --prerelease \
              --title "${{ steps.get_version.outputs.VERSION }}" \
              --notes "Release ${{ steps.get_version.outputs.VERSION }}"
          else
            gh release create ${{ steps.get_version.outputs.VERSION }} \
              --title "${{ steps.get_version.outputs.VERSION }}" \
              --notes "Release ${{ steps.get_version.outputs.VERSION }}"
          fi

  publish:
    needs: [validate, github-release]
    runs-on: ubuntu-26.04
    environment: release
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: auth
      - run: cargo publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  slack_notify:
    needs: [validate, github-release, publish]
    timeout-minutes: 20
    runs-on: ubuntu-slim
    if: ${{ always() }}
    permissions:
      actions: read
      contents: read
    steps:
      - name: Slack Notification
        # 時雨堂の社内 action であり、社内の修正を全リポジトリへ即時反映させるため、
        # 他 action と異なり可変 ref の @main を意図的に使う
        uses: shiguredo/github-actions/.github/actions/slack-notify@main
        with:
          status: ${{ job.status }}
          slack_webhook: ${{ secrets.SLACK_WEBHOOK }}
          slack_channel: rust-oss
          notify_mode: failure_and_fixed
        env:
          GH_TOKEN: ${{ github.token }}
